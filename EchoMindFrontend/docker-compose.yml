# 与 ../EchoMind 的默认项目名一致，复用已有容器、网络和数据卷。
name: echomind

services:
  echomind:
    build:
      context: ../EchoMind
      dockerfile: Dockerfile
      target: production
    container_name: echomind-app
    ports:
      - "8000:8000"
    env_file:
      - ../EchoMind/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-echomind123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-echomind123}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      ECHOMIND_SKILLS_DIR: /app/skills
      ECHOMIND_BUSINESS_DB_PATH: /app/data/business/echomind.sqlite3
      ECHOMIND_AUTH_REQUIRED: ${ECHOMIND_AUTH_REQUIRED:-true}
      ECHOMIND_ALLOW_LOCAL_CHROMA_FALLBACK: "false"
    volumes:
      - ../EchoMind/data/chroma:/app/data/chroma
      - ../EchoMind/data/eval:/app/data/eval
      - ../EchoMind/data/business:/app/data/business
      - ../EchoMind/skills:/app/skills
      - ../EchoMind/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=12).read()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - echomind-network

  redis:
    image: redis:7-alpine
    container_name: echomind-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-echomind123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-echomind123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echomind-network

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: echomind-chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - echomind-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echomind-frontend
    environment:
      PYTHON_API_URL: /api/python
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      echomind:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - echomind-network

  nginx:
    image: nginx:alpine
    container_name: echomind-nginx
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      echomind:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - echomind-network

  # 保留原后端部署的监控服务及历史数据。
  prometheus:
    image: prom/prometheus:latest
    container_name: echomind-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ../EchoMind/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - echomind-network

networks:
  echomind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
